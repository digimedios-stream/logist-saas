<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icono.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icono.png" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b1326" />

    <meta name="description" content="Logística - Sistema de Gestión de Transporte Profesional." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <title>Movix - Gestión de Flota</title>
  </head>
  <body class="bg-lazdin-bg text-lazdin-on-surface font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // En entorno móvil nativo (Capacitor), deshabilitar el SW para evitar retrasos de 3s en peticiones locales
      const isCapacitor = window.Capacitor !== undefined || 
                          window.location.protocol === 'capacitor:' || 
                          window.location.protocol === 'http:' && window.location.hostname === 'localhost' && window.location.port === '';
      
      if ('serviceWorker' in navigator) {
        if (isCapacitor) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
          });
        }
      }
    </script>
  </body>
</html>
